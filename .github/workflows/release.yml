name: Release

# Single job, triggered only by `push` to main -- deliberately not split into a second workflow
# triggered by tag push. GitHub Actions does not re-trigger `on: push`/`on: <tag-push>` workflows for
# a push made with the default GITHUB_TOKEN (its documented anti-recursion rule), so a tag/commit this
# job pushes with that token would never start a second workflow: splitting the pipeline that way
# would leave the tag-triggered half permanently unrun. Everything -- version decision, file bump,
# CHANGELOG.md, tag, GitHub Release, optional PyPI publish -- happens here instead.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # queue, never cancel a release partway through

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags: compute_version.sh and render_changelog.sh need both

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Read the current version (pyproject.toml)
        id: current
        run: |
          CURRENT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve the next version (release-drafter, dry run)
        id: drafter
        continue-on-error: true   # bootstrap (no prior tag) can leave this with nothing to resolve;
                                  # compute_version.sh only reads its output when it actually needs to
        # v7: v6 has no dry-run input (it was silently ignored), and v7 dropped disable-autolabeler
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          dry-run: true
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide this push's release version
        id: compute
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          DRAFTER_RESOLVED_VERSION: ${{ steps.drafter.outputs.resolved_version }}  # underscore: resolved-version was always empty
        run: bash .github/scripts/compute_version.sh

      - name: Nothing to release
        if: steps.compute.outputs.should_release != 'true'
        run: echo "v${{ steps.compute.outputs.next_version }} is already tagged; nothing to do."

      - name: Install the package (needed to regenerate the pinned contract snapshot)
        if: steps.compute.outputs.should_release == 'true'
        run: python3 -m pip install -q -e .

      - name: Bump version files
        if: steps.compute.outputs.should_release == 'true'
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          NEXT_VERSION: ${{ steps.compute.outputs.next_version }}
          REGENERATE_CONTRACT: "1"
        run: bash .github/scripts/bump_version_files.sh

      - name: Render CHANGELOG.md and release notes
        if: steps.compute.outputs.should_release == 'true'
        env:
          LATEST_TAG: ${{ steps.compute.outputs.latest_tag }}
          NEXT_VERSION: ${{ steps.compute.outputs.next_version }}
        run: bash .github/scripts/render_changelog.sh

      - name: Commit, tag, and push
        if: steps.compute.outputs.should_release == 'true'
        env:
          NEXT_VERSION: ${{ steps.compute.outputs.next_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/video_editing_skill/__init__.py CHANGELOG.md tests/contract/contract.json
          if git diff --cached --quiet; then
            echo "no file changes to commit for v${NEXT_VERSION} (changelog-only release notes still apply to the tag)"
          else
            git commit -m "chore(release): v${NEXT_VERSION}"
          fi
          # An annotated tag, pushed by name: --follow-tags skips lightweight tags, so the tag this
          # step used to make never left the runner and "Create the GitHub Release" failed with
          # "tag v0.4.0 exists locally but has not been pushed" (no release was ever published).
          git tag -a "v${NEXT_VERSION}" -m "v${NEXT_VERSION}"
          git push origin HEAD:main "refs/tags/v${NEXT_VERSION}"

      - name: Create the GitHub Release
        if: steps.compute.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.compute.outputs.next_version }}
        run: gh release create "v${NEXT_VERSION}" --title "v${NEXT_VERSION}" --notes-file release_notes.md

      - name: Check whether a PyPI token is configured
        id: pypi
        run: |
          if [ -n "${{ secrets.PYPI_API_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "PYPI_API_TOKEN is not set; the tag and GitHub Release above were still created, publish is skipped."
          fi

      - name: Build the distribution
        if: steps.compute.outputs.should_release == 'true' && steps.pypi.outputs.present == 'true'
        run: |
          python3 -m pip install -q build
          python3 -m build

      - name: Publish to PyPI
        if: steps.compute.outputs.should_release == 'true' && steps.pypi.outputs.present == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
