name: PR autolabel

# pull_request_target (not pull_request): a fork's PR runs with base-repo permissions and secrets, which
# is required to write a label to it at all -- pull_request from a fork gets a read-only token. This is
# safe here specifically because the job below never checks out or executes the PR's own code (it only
# calls the GitHub API through release-drafter's autolabeler), which is the standard mitigation for using
# pull_request_target: https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  autolabel:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          disable-releaser: true
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
