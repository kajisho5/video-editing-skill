[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "video-editing-skill"
version = "0.1.0"
description = "Deterministic video editing Skill: typed edit requests (trim, cut, concat, speed, fit, overlay) compiled to an operation graph and executed through ffmpeg-skill. Not an AI agent."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "kajisho5"}]
keywords = ["video", "editing", "ffmpeg", "timeline", "agent-skill", "skill"]
dependencies = []

[project.scripts]
video-editing = "video_editing_skill.cli:main"

[project.urls]
Repository = "https://github.com/kajisho5/video-editing-skill"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py39"

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
